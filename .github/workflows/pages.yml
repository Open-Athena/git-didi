name: Viewer (GitHub Pages)
on:
  push:
    branches: [main]
    paths: ['www/**', '.github/workflows/pages.yml']
  pull_request:
    paths: ['www/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: www
    steps:
    - uses: actions/checkout@v4
    - uses: pnpm/action-setup@v4
      with:
        version: 10
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm
        cache-dependency-path: www/pnpm-lock.yaml
    - run: pnpm install --frozen-lockfile
    - run: pnpm test
    - run: pnpm build
    - uses: actions/upload-pages-artifact@v3
      if: github.event_name != 'pull_request'
      with:
        path: www/dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - id: deployment
      uses: actions/deploy-pages@v4
